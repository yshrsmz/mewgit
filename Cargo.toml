[workspace]
resolver = "2"
members = ["crates/mewgit-core", "crates/mewgit-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yshrsmz/mewgit"
authors = ["CODINGFELINE"]
# crates.io には上げない。配布は GitHub Release のバイナリと `cargo install --path`。
publish = false

[workspace.dependencies]
# io-util は `git apply --cached -` の標準入力に書くため（`AsyncWriteExt`）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
secrecy = "0.10"
# `join_all` を core と tui の両方が使う。**版を 1 本にする** —— 別々に書くと
# Renovate が片方だけ上げたときに、境目をまたぐ `Future` / `Stream` が別クレートの
# 型に割れる（crossterm と ratatui で踏んだ形。CLAUDE.md）。
futures = "0.3"
