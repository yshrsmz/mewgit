[package]
name = "mewgit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core logic for mewgit (git reading, git CLI execution, GitHub integration, graph layout)"

[dependencies]
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
secrecy.workspace = true
git2 = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "1.0"
globset = "0.4"
tempfile = { version = "3", optional = true }

[features]
# 統合テスト用のリポジトリ生成ヘルパ（`test_util`）を有効にする。
test-util = ["dep:tempfile"]

[dev-dependencies]
anyhow.workspace = true
mewgit-core = { path = ".", features = ["test-util"] }
# 統合テストが `tempfile::tempdir()` を直に使う（リポジトリの外を開くケース）。
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
