name: CI

# ビルドに関係しないファイルだけの変更では走らせない。`paths-ignore` は変更された
# ファイルが**すべて**一致したときだけスキップするので、docs とコードを同じ PR で
# 触れば走る。
#
# `.github/workflows/**` は意図的に入れていない。ワークフロー自身の変更は、その
# ワークフローで検証したい。
#
# **必須ステータスチェックを設定するときはこの書き方をやめること。** `paths-ignore`
# でスキップされたチェックは「実行されなかった」ではなく「報告が無い」になり、PR が
# 永久に pending でマージできなくなる。そのときは同名の常に成功するジョブを別途置く。
# いまの ruleset は deletion / non_fast_forward / pull_request の 3 つだけで、
# 必須チェックは無い。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE-*'
      - 'renovate.json'
  pull_request:
    # GitHub Actions は YAML のアンカー / エイリアスを解釈しないので、上と同じ並びを
    # 手で書く。片方だけ足すとブランチと PR で挙動が割れる。
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE-*'
      - 'renovate.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo fmt --all --check

  # macOS runner は 1 分 $0.062 で ubuntu-latest（$0.006）の 10.33 倍かかる。
  # 2026-09 の実績では、この 1 ジョブが 255 分 = $15.81（gross）で、個人アカウント
  # の private リポ全体 $36.30 の 43% を占めていた。GitHub Pro の included は
  # 月 $18.00 相当なので、この分を落とすと gross $20.49 となり、実請求は
  # $18.28 から $2.49 に下がる計算になる。
  #
  # 開発機が macOS なので、日常の `cargo test` が常に macOS を通っている。
  # ローカルで踏まないのは Linux 側であり、CI で再検証する価値が低い方を落とした。
  #
  # macOS 固有のバグを踏んだら matrix を戻す:
  #     runs-on: ${{ matrix.os }}
  #     strategy:
  #       fail-fast: false
  #       matrix:
  #         os: [ubuntu-latest, macos-latest]
  #   と name を `clippy + test (${{ matrix.os }})` に戻す。
  check:
    name: clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 上の `--all-targets` では tui の dev-dependency が core の `test-util` を有効にし、
      # feature の統合で core の lib もそれ付きでビルドされる。出荷する形（release.yml の
      # `cargo build --release -p mewgit`）は test-util を持たないので、そこでだけ出る警告
      # （`cfg(feature = "test-util")` の中でしか使わない import など）はここで拾う。
      # v0.1.2 のビルドがこれで落ちた（#216 の `seated_index`）。拾えるのは feature の軸だけで、
      # ターゲットの軸は拾えない —— このジョブは x86_64 Linux なので、`cfg(not(target_os = "linux"))`
      # の側（`mewgit-tui` の `runtime.rs`）を test-util なしで見るのは release.yml の macOS ビルドだけ
      - run: cargo clippy -p mewgit --locked -- -D warnings
      - run: cargo test --workspace --locked
