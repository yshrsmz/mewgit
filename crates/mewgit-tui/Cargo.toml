[package]
name = "mewgit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A TUI git client with commit graph and GitHub integration"

[[bin]]
name = "mewgit"
path = "src/main.rs"

[dependencies]
mewgit-core = { path = "../mewgit-core" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `unstable-rendered-line-info` は `Paragraph::line_count`（折り返し後の行数）を
# 開ける。自前の見積もりだと単語境界で折れたぶんを数え落とし、確認モーダルの
# 本文の末尾が黙って切れる（07 の「モーダル」）。
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

[dev-dependencies]
# ランタイムのテストが実リポジトリを要る。`features` を付けないと
# `cargo test -p mewgit` 単体で feature が有効にならない。
mewgit-core = { path = "../mewgit-core", features = ["test-util"] }
