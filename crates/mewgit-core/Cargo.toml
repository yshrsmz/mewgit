[package]
name = "mewgit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Core logic for mewgit (git reading, git CLI execution, GitHub integration, graph layout)"

[dependencies]
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
secrecy.workspace = true
git2 = "0.21"
# キャンセルでプロセスグループへ SIGTERM を送るため（03 の「キャンセル」）。
# tokio の `Child::kill` は SIGKILL しか送れず、それだと git が index.lock を
# 残したまま死ぬ（実測。03 の表）。
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
# `auth::resolve` が候補ごとの probe を並列に回すため（`join_all`）。tokio には
# 動的な本数を待つ組み合わせ子が無く、`JoinSet` は 'static を要求するので
# `&Backend` を借りる future を載せられない。
futures.workspace = true
toml = "1.0"
globset = "0.4"
tempfile = { version = "3", optional = true }

[features]
# 統合テスト用のリポジトリ生成ヘルパ（`test_util`）を有効にする。
test-util = ["dep:tempfile"]

[dev-dependencies]
anyhow.workspace = true
mewgit-core = { path = ".", features = ["test-util"] }
# 統合テストが `tempfile::tempdir()` を直に使う（リポジトリの外を開くケース）。
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
